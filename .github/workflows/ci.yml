name: Portfolio CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Download repository code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build Docker image
        run: docker build -t portfolio:ci .

      - name: Start portfolio container
        run: |
          docker run -d \
            --name portfolio-ci \
            -p 127.0.0.1:8080:8080 \
            portfolio:ci

      - name: Check website response
        run: |
          curl --fail --silent --show-error \
            --retry 10 \
            --retry-all-errors \
            --retry-delay 2 \
            --retry-max-time 60 \
            --max-time 10 \
            http://127.0.0.1:8080/ \
            -o /tmp/portfolio.html

          grep -q '<app-root' /tmp/portfolio.html

      - name: Show container logs
        if: always()
        run: docker logs portfolio-ci || true

      - name: Remove container
        if: always()
        run: docker rm -f portfolio-ci || true