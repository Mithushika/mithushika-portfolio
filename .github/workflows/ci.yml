name: Portfolio CI and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Download repository code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build Docker image for GitHub Pages
        run: |
          docker build \
            --build-arg BASE_HREF=/mithushika-portfolio/ \
            -t portfolio:ci .

      - name: Start portfolio container
        run: |
          docker run -d \
            --name portfolio-ci \
            -p 127.0.0.1:8080:8080 \
            portfolio:ci

      - name: Check website response
        run: |
          curl --fail --silent --show-error \
            --retry 10 \
            --retry-all-errors \
            --retry-delay 2 \
            --retry-max-time 60 \
            --max-time 10 \
            http://127.0.0.1:8080/ \
            -o /tmp/portfolio.html

          grep -q '<app-root' /tmp/portfolio.html
          grep -q 'base href="/mithushika-portfolio/"' /tmp/portfolio.html

      - name: Extract built website
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p site
          docker cp portfolio-ci:/usr/share/nginx/html/. site/

      - name: Upload website for deployment
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Show container logs
        if: always()
        run: docker logs portfolio-ci || true

      - name: Remove container
        if: always()
        run: docker rm -f portfolio-ci || true

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build-and-check
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4